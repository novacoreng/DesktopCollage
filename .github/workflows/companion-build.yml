name: Companion service build

on:
  push:
    branches: [main]
    paths:
      - 'services/DesktopCollage.Companion/**'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'services/DesktopCollage.Companion/**'
      - '.github/workflows/companion-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore services/DesktopCollage.Companion/DesktopCollage.Companion.csproj
      - name: Build
        run: dotnet build services/DesktopCollage.Companion/DesktopCollage.Companion.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish services/DesktopCollage.Companion/DesktopCollage.Companion.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output publish/companion
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCollage-Companion-win-x64
          path: publish/companion/
