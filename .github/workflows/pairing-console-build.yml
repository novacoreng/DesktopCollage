name: Pairing console build
on:
  push:
    branches: [main]
    paths:
      - 'tools/DesktopCollage.PairingConsole/**'
      - '.github/workflows/pairing-console-build.yml'
  pull_request:
    paths:
      - 'tools/DesktopCollage.PairingConsole/**'
      - '.github/workflows/pairing-console-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tools/DesktopCollage.PairingConsole/DesktopCollage.PairingConsole.csproj --configuration Release
