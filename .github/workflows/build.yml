name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/DesktopCollage.App/DesktopCollage.App.csproj
      - name: Compile Release
        run: dotnet build src/DesktopCollage.App/DesktopCollage.App.csproj -c Release --no-restore
      - name: Publish Windows x64 test build
        run: dotnet publish src/DesktopCollage.App/DesktopCollage.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/win-x64
      - name: Verify test executable
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/win-x64/DesktopCollage.exe")) {
            throw "DesktopCollage.exe missing from published output"
          }
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCollage-Phase1-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error
          retention-days: 14
